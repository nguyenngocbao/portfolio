services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://portfolio.nguyenngocbao.info}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://portfolio.nguyenngocbao.info}
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/portfolio}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Chỉ mở trên localhost; nginx trên host proxy_pass http://127.0.0.1:4000
      - "127.0.0.1:${PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
